<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somnius Notepad</title>
<link rel="stylesheet" href="../shared.css">
<script src="../data/pages.js"></script>
<script src="../data/pages2.js"></script>
<script src="../data/pages3.js"></script>
<script src="../shared.js"></script>
</head>
<body>
<div class="prog">
  <div class="prog-head"><span>📝 Somnius Notepad</span><span class="sub">case notes</span></div>
  <div class="prog-body">
    <textarea id="notes" placeholder="Your notes. The game never writes here for you — except Tier 3, when Somnius Assist pins a URL because you are stuck."></textarea>
    <h3 style="margin:8px 0 4px">Pinned pages</h3>
    <div id="pins"><i>Nothing pinned yet. Use “📌 Pin to Notepad” in the browser.</i></div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
